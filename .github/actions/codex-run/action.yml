name: Run Codex with the shared ChatGPT login
description: >
  Restores the ChatGPT-managed Codex login (auth.json), then either answers the
  triggering issue or comment (mode: reply) or forces a token refresh (mode:
  refresh). If Codex rewrote auth.json, the new copy is encrypted and saved to
  the Actions cache, where the next run picks it up.

# Why a cache and not a secret: OpenAI rotates the refresh token every time
# Codex refreshes, so the refreshed auth.json has to be saved somewhere each
# time. The job's GITHUB_TOKEN cannot write secrets, but it can write the
# Actions cache, so the login is kept there, encrypted with CODEX_AUTH_KEY.
# CODEX_AUTH_JSON is only the first seed, used when the cache is empty.
# Background: https://learn.chatgpt.com/docs/auth/ci-cd-auth (ephemeral runners).
#
# This whole file is read from the default branch when the step starts, so
# checking out a PR branch partway through cannot change what runs here.

inputs:
  mode:
    description: "reply (answer the issue or comment) or refresh (keep-alive)"
    default: reply
  trigger:
    description: "The tag that started the workflow"
    default: "@codex"
  codex-auth-key:
    description: "Passphrase for the encrypted login in the cache (secrets.CODEX_AUTH_KEY)"
    required: true
  codex-auth-seed:
    description: "Initial auth.json from `codex login` (secrets.CODEX_AUTH_JSON)"
    required: true
  codex-version:
    description: "Pinned @openai/codex version"
    default: "0.165.0"

runs:
  using: composite
  steps:
    - name: Post a progress comment
      id: progress
      if: inputs.mode == 'reply'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        NUMBER: ${{ github.event.issue.number }}
        TRIGGER: ${{ inputs.trigger }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
          -f body="Codex ($TRIGGER) is working on this. [View job]($RUN_URL)" --jq .id)
        echo "comment_id=$id" >> "$GITHUB_OUTPUT"

    - name: Install Codex CLI
      shell: bash
      env:
        CODEX_VERSION: ${{ inputs.codex-version }}
      run: |
        npm install -g "@openai/codex@$CODEX_VERSION" >/dev/null
        codex --version

    - name: Restore the encrypted login
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/codex-auth/auth.enc
        # Never an exact hit; restore-keys returns the newest saved login.
        key: codex-auth-restore-${{ github.run_id }}
        restore-keys: codex-auth-

    - name: Unpack the login
      shell: bash
      env:
        CODEX_AUTH_KEY: ${{ inputs.codex-auth-key }}
        CODEX_AUTH_SEED: ${{ inputs.codex-auth-seed }}
      run: |
        umask 077
        home="$RUNNER_TEMP/codex-home"
        mkdir -p "$home" && chmod 700 "$home"
        enc="$RUNNER_TEMP/codex-auth/auth.enc"
        if [ -s "$enc" ]; then
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:CODEX_AUTH_KEY \
            -in "$enc" -out "$home/auth.json"
          echo "Restored the login from the Actions cache."
        else
          printf '%s' "$CODEX_AUTH_SEED" > "$home/auth.json"
          echo "No saved login in the cache; seeded from the CODEX_AUTH_JSON secret."
        fi
        chmod 600 "$home/auth.json"
        if ! jq -e '.auth_mode == "chatgpt" and ((.tokens.refresh_token // "") | length > 0)' "$home/auth.json" >/dev/null; then
          echo "::error::auth.json is not a ChatGPT login with a refresh token. Reseed CODEX_AUTH_JSON (see AGENTS.md)."
          exit 1
        fi
        jq -r '"last_refresh: \(.last_refresh)"' "$home/auth.json"
        echo "CODEX_HOME=$home" >> "$GITHUB_ENV"
        echo "CODEX_AUTH_SHA=$(sha256sum "$home/auth.json" | cut -d' ' -f1)" >> "$GITHUB_ENV"

    - name: Check out the pull request branch
      if: inputs.mode == 'reply' && github.event.issue.pull_request
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        NUMBER: ${{ github.event.issue.number }}
      run: gh pr checkout "$NUMBER"

    - name: Build the prompt
      id: prompt
      if: inputs.mode == 'reply'
      shell: bash
      env:
        TRIGGER: ${{ inputs.trigger }}
        EVENT_NAME: ${{ github.event_name }}
        ACTOR: ${{ github.event.sender.login }}
        COMMENT_BODY: ${{ github.event.comment.body }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
        ISSUE_BODY: ${{ github.event.issue.body }}
        NUMBER: ${{ github.event.issue.number }}
        IS_PR: ${{ github.event.issue.pull_request && 'true' || 'false' }}
      run: |
        # Event text arrives through env, never an inline expression, so quotes and
        # backticks in a comment cannot break out into the shell.
        if [ "$EVENT_NAME" = issue_comment ]; then
          text=$COMMENT_BODY
        else
          text="$ISSUE_TITLE"$'\n\n'"$ISSUE_BODY"
        fi

        # Model and effort selector: @codex+<model>[:<effort>], e.g.
        # @codex+gpt-6-luna:high or @codex:low. Bare tag = plan defaults.
        # The first tag that carries a selector wins, so a bare @codex in an
        # issue title does not hide @codex+<model> in its body.
        tags=$(grep -oiE -- "${TRIGGER}(\+[a-z0-9.-]*[a-z0-9])?(:(none|minimal|low|medium|high|xhigh|max|ultra))?" <<<"$text" | tr '[:upper:]' '[:lower:]' || true)
        tag=$(grep -E -- '[+:]' <<<"$tags" | head -n1 || true)
        if [ -z "$tag" ]; then tag=$(head -n1 <<<"$tags"); fi
        rest=${tag#"$TRIGGER"}
        model=""
        effort=""
        if [[ $rest == *:* ]]; then effort=${rest##*:}; rest=${rest%%:*}; fi
        if [[ $rest == +* ]]; then model=${rest#+}; fi
        echo "model=$model" >> "$GITHUB_OUTPUT"
        echo "effort=$effort" >> "$GITHUB_OUTPUT"

        if [ "$IS_PR" = true ]; then
          kind="pull request"
          read_cmd="gh pr view $NUMBER --comments && gh pr diff $NUMBER"
          branch_rule="You are on the pull request's branch ($(git rev-parse --abbrev-ref HEAD)). Commit and push changes there."
        else
          kind="issue"
          read_cmd="gh issue view $NUMBER --comments"
          branch="codex/issue-$NUMBER-$GITHUB_RUN_ID"
          branch_rule="You are on main. If you change files, create branch $branch, commit, push with \`git push -u origin HEAD\`, then open a pull request: \`gh pr create --base main --head $branch --title '<short title>' --body-file <file>\`, with a body that summarizes the change and ends with 'Refs #$NUMBER'. Put the pull request link on the first line of your reply. If \`gh pr create\` fails, say so in one line and end your reply with [Open a pull request](https://github.com/$GITHUB_REPOSITORY/compare/main...$branch?expand=1) instead."
        fi
        media_rule="If you create or change images, GIFs or videos (renders, previews, plots, screenshots), embed the few that matter most in your reply so they show inline, e.g. ![short description](https://github.com/$GITHUB_REPOSITORY/blob/<7-character hash>/<path>?raw=true). Use the commit you pushed, PNG, JPG or GIF (GIFs animate; SVG and video do not render inline, so link those). Keep embeds small: a few key images, not every file."

        {
          printf '%s mentioned %s on %s No. %s in %s.\n\n' "$ACTOR" "$TRIGGER" "$kind" "$NUMBER" "$GITHUB_REPOSITORY"
          printf 'Read AGENTS.md first. Read the whole thread with: %s\n\n' "$read_cmd"
          printf '%s\n\n' "$branch_rule"
          printf '%s\n\n' "$media_rule"
          cat <<'EOF'
        Rules for this run:
        - Your final message is posted as the reply on GitHub, in GitHub markdown. Do not post comments yourself.
        - Do not merge or close pull requests, close issues, delete branches, or push to main.
        - Never print, echo, or grep environment secrets, and never read or print anything under $CODEX_HOME.
        - Link files you mention to the commit you pushed (7-character hash), not to a branch.

        The request:
        EOF
          printf '<request>\n%s\n</request>\n' "$text"
        } > "$RUNNER_TEMP/codex-prompt.md"

        git config user.name "codex (GitHub Actions)"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Run Codex
      id: codex
      if: inputs.mode == 'reply'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        MODEL: ${{ steps.prompt.outputs.model }}
        EFFORT: ${{ steps.prompt.outputs.effort }}
        COMMENT_ID: ${{ steps.progress.outputs.comment_id }}
        TRIGGER: ${{ inputs.trigger }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        # Live progress: --json makes Codex print one event per line (plan
        # updates, commands, file edits, interim messages; schema in
        # codex-rs/exec/src/exec_events.rs). A background loop turns the latest
        # events into the progress comment once a minute. Command output is
        # never posted, only the command line. "Post the reply" overwrites the
        # comment when Codex ends. The filter is inline because this file is
        # read before the PR checkout, and a file in the action folder is not.
        events="$RUNNER_TEMP/codex-events.jsonl"
        : > "$events"
        cat > "$RUNNER_TEMP/codex-progress.jq" <<'JQ'
        def clip($n): if length > $n then .[0:$n] + "…" else . end;
        # Codex wraps the script in matching ' or " quotes; drop the pair (and
        # the \" escapes inside "...") before keeping only the first line.
        def unquote: .[0:1] as $q
          | if length > 1 and ($q == "'" or $q == "\"") and .[-1:] == $q
            then .[1:-1] | if $q == "\"" then gsub("\\\\\""; "\"") else . end
            else . end;
        def cmd: sub("^/bin/(ba)?sh -l?c "; "") | unquote | split("\n")[0]
          | gsub("`"; "'") | clip(120);
        def rel: ltrimstr($ws + "/");
        def line:
          if .type == "command_execution" then
            (if .status == "in_progress" then "⏳" elif .exit_code == 0 then "✅" else "❌" end)
            + " `" + (.command | cmd) + "`"
          elif .type == "file_change" then
            "📝 " + ([.changes[] | .kind + " `" + (.path | rel) + "`"] | join(", "))
          elif .type == "web_search" then "🔎 " + (.query | clip(120))
          elif .type == "mcp_tool_call" then "🔧 " + .server + "." + .tool
          else empty end;
        [inputs | fromjson? | select(type == "object" and (.item | type) == "object")] as $ev
        | ($ev | map(select(.item.type == "todo_list")) | last | .item.items // []) as $todo
        | ($ev | map(select(.type == "item.completed" and .item.type == "agent_message")) | last | .item.text // "") as $msg
        | ($ev | map(.item | select(.type | IN("command_execution", "file_change", "web_search", "mcp_tool_call")))
            | reverse
            | reduce .[] as $i ({seen: {}, out: []};
                if .seen[$i.id] then . else .seen[$i.id] = true | .out += [$i] end)
            | .out | reverse) as $acts
        | [
            "**Codex (\($trigger)) is working on this.** \($elapsed) so far. [View job](\($run_url))",
            (if ($todo | length) > 0 then
              "\n**Plan**\n" + ([$todo[] | "- " + (if .completed then "✅ " else "⬜ " end) + (.text | clip(200))] | join("\n"))
             else empty end),
            (if $msg != "" then
              "\n**Latest update**\n" + ($msg | sub("\\s+$"; "") | clip(1200) | split("\n") | map("> " + .) | join("\n"))
             else empty end),
            (if ($acts | length) > 0 then
              "\n**Recent activity** (\($acts | map(select(.type == "command_execution")) | length) commands so far)\n"
              + ([$acts[-8:][] | line | "- " + .] | join("\n"))
             else empty end),
            "\n<sub>Updated about once a minute while Codex runs; replaced by the final reply when it finishes.</sub>"
          ] | join("\n")
        JQ

        # The loop stops at the flag file, never mid-request, so its last edit
        # always lands before the final reply.
        stop="$RUNNER_TEMP/codex-progress.stop"
        progress() {
          local start=$SECONDS
          sleep 30 & wait $! || true
          while [ ! -e "$stop" ]; do
            local m=$(( (SECONDS - start + 30) / 60 ))
            jq -R -n -r --arg trigger "$TRIGGER" --arg run_url "$RUN_URL" --arg ws "$GITHUB_WORKSPACE" \
              --arg elapsed "${m} min" -f "$RUNNER_TEMP/codex-progress.jq" "$events" \
              > "$RUNNER_TEMP/codex-progress.md" \
              && [ ! -e "$stop" ] \
              && gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" \
                   -F body=@"$RUNNER_TEMP/codex-progress.md" >/dev/null \
              || [ -e "$stop" ] || echo "::warning::Could not update the progress comment."
            sleep 60 & wait $! || true
          done
        }
        if [ -n "$COMMENT_ID" ]; then progress & progress_pid=$!; fi

        # The runner is the sandbox. ignore_default_excludes keeps GH_TOKEN visible
        # to Codex's shell, which otherwise drops any variable named *KEY*,
        # *SECRET* or *TOKEN*.
        args=(exec --dangerously-bypass-approvals-and-sandbox --color never --json
              -c shell_environment_policy.ignore_default_excludes=true
              -o "$RUNNER_TEMP/codex-reply.md")
        if [ -n "$MODEL" ]; then args+=(-m "$MODEL"); fi
        if [ -n "$EFFORT" ]; then args+=(-c "model_reasoning_effort=\"$EFFORT\""); fi
        status=0
        codex "${args[@]}" - < "$RUNNER_TEMP/codex-prompt.md" | tee -a "$events" || status=$?

        # Stop the updater before "Post the reply" writes the final comment:
        # raise the flag, cut its sleep short, and wait for it to exit.
        if [ -n "${progress_pid:-}" ]; then
          touch "$stop"
          pkill -P "$progress_pid" -x sleep 2>/dev/null || true
          wait "$progress_pid" 2>/dev/null || true
        fi
        exit "$status"

    - name: Force a token refresh
      if: inputs.mode == 'refresh'
      shell: bash
      run: |
        # Codex 0.165 (codex-rs/login/src/auth/manager.rs, proactive_refresh_reason)
        # refreshes when the access token is within 5 minutes of its exp, and
        # falls back to "last_refresh older than 8 days" only when the access
        # token has no readable exp. So: swap in a JWT-shaped placeholder with
        # no exp ("{}" payload) and backdate last_refresh. Codex then refreshes
        # before its first request. If the refresh fails, the save step below
        # refuses this file and the previous login stays in the cache.
        # Tested 2026-10-29 on a copy of this login: new access token, rotated
        # refresh token.
        f="$CODEX_HOME/auth.json"
        jq '.tokens.access_token = "e30.e30.x" | .last_refresh = "2000-01-01T00:00:00Z"' "$f" > "$f.tmp"           && mv "$f.tmp" "$f" && chmod 600 "$f"
        codex exec --skip-git-repo-check --ephemeral --color never "Reply with the single word OK." < /dev/null
        if jq -e '(.last_refresh | startswith("2000-")) or .tokens.access_token == "e30.e30.x"' "$f" >/dev/null; then
          echo "::error::Codex did not refresh the login. Reseed CODEX_AUTH_JSON (see AGENTS.md)."
          exit 1
        fi
        jq -r '"refreshed; last_refresh: \(.last_refresh)"' "$f"

    - name: Encrypt the login if Codex changed it
      id: changed
      if: always()
      shell: bash
      env:
        CODEX_AUTH_KEY: ${{ inputs.codex-auth-key }}
      run: |
        # Nothing to do if the login was never unpacked.
        if [ -z "${CODEX_HOME:-}" ] || [ ! -f "$CODEX_HOME/auth.json" ]; then exit 0; fi
        f="$CODEX_HOME/auth.json"
        if [ "$(sha256sum "$f" | cut -d' ' -f1)" = "$CODEX_AUTH_SHA" ]; then
          echo "Login unchanged; nothing to save."
          exit 0
        fi
        if ! jq -e '.auth_mode == "chatgpt" and ((.tokens.refresh_token // "") | length > 0) and (.last_refresh | startswith("2000-") | not) and .tokens.access_token != "e30.e30.x"' "$f" >/dev/null; then
          echo "::error::auth.json changed but is not a usable login; not saving it."
          exit 1
        fi
        umask 077
        mkdir -p "$RUNNER_TEMP/codex-auth"
        openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:CODEX_AUTH_KEY \
          -in "$f" -out "$RUNNER_TEMP/codex-auth/auth.enc"
        echo "save=true" >> "$GITHUB_OUTPUT"

    - name: Save the refreshed login
      if: always() && steps.changed.outputs.save == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/codex-auth/auth.enc
        key: codex-auth-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Post the reply
      if: always() && inputs.mode == 'reply' && steps.progress.outputs.comment_id != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        COMMENT_ID: ${{ steps.progress.outputs.comment_id }}
        OUTCOME: ${{ steps.codex.outcome }}
        TRIGGER: ${{ inputs.trigger }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        reply="$RUNNER_TEMP/codex-reply.md"
        {
          if [ "$OUTCOME" = success ] && [ -s "$reply" ]; then
            printf '**Codex (%s) finished.** [View job](%s)\n\n---\n\n' "$TRIGGER" "$RUN_URL"
            cat "$reply"
          else
            printf '**Codex (%s) did not finish** (step outcome: %s). [View job](%s)\n' "$TRIGGER" "${OUTCOME:-not run}" "$RUN_URL"
            if [ -s "$reply" ]; then printf '\n---\n\n'; cat "$reply"; fi
          fi
        } > "$RUNNER_TEMP/codex-body.md"
        gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -F body=@"$RUNNER_TEMP/codex-body.md" >/dev/null

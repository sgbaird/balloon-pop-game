name: Codex

# @codex in an issue (title or body) or in an issue or PR conversation comment,
# from someone with write access. The repository is public, so the
# author_association check is what keeps strangers from starting a run.
# Review-thread comments and reviews are not triggers; use a normal PR
# conversation comment.
#
# OpenAI's ChatGPT Codex GitHub app ("chatgpt-codex-connector") also answers
# @codex. It is not installed here; if it ever is, both will reply.
#
# Runs share one ChatGPT login and can overlap: codex-keepalive.yml refreshes
# it twice a week, well before the 10-day access token nears expiry, so these
# runs normally never refresh it themselves.

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  codex:
    if: |
      github.event.sender.type != 'Bot' &&
      ((github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@codex') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
       (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@codex') || contains(github.event.issue.title, '@codex')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)))
    # One run at a time per issue or PR: a new @codex waits for the current run
    # instead of racing it on the same branch. GitHub keeps one waiting run per
    # group, so a third @codex replaces the waiting second one. Job-level, so
    # comments without @codex (skipped by the `if`) never join the queue.
    concurrency:
      group: codex-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/codex-run
        with:
          trigger: "@codex"
          codex-auth-key: ${{ secrets.CODEX_AUTH_KEY }}
          codex-auth-seed: ${{ secrets.CODEX_AUTH_JSON }}
